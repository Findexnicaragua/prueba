<svg xmlns="http://www.w3.org/2000/svg" width="720" height="469" viewBox="0 0 720 469" role="img">
<rect width="720" height="469" fill="#F8F9FA" rx="10" stroke="#DADCE0"/>
<text x="16" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1F1F1F" font-weight="600" text-anchor="start" >El cliente pagó de más: decidir qué hacer con el excedente</text>
<text x="16" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5F6368" font-weight="400" text-anchor="start" >Quién puede: admin / admin de cobranza (la app nunca decide sola)</text>
<circle cx="28" cy="70" r="11" fill="#E8F0FE"/>
<text x="28" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#1A73E8" font-weight="600" text-anchor="middle" >1</text>
<text x="56" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="600" text-anchor="start" >Al suspender/cancelar con meses ya pagados, aparece «A favor del cliente»</text>
<rect x="56" y="82" width="652" height="58" rx="10" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
<line x1="68" y1="135" x2="696" y2="135" stroke="#EEEEEE" stroke-width="0.8"/>
<text x="696" y="107" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1F1F1F" font-weight="600" text-anchor="end" >C$ 300</text>
<text x="70" y="107" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="500" text-anchor="start" >A favor del cliente</text>
<text x="70" y="123" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5F6368" font-weight="400" text-anchor="start" >Pagó por adelantado servicio que no se prestará. ¿Qué hacés?</text>
<circle cx="28" cy="166" r="11" fill="#E8F0FE"/>
<text x="28" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#1A73E8" font-weight="600" text-anchor="middle" >2</text>
<text x="56" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="600" text-anchor="start" >Elegí UNA de las tres opciones</text>
<rect x="56" y="178" width="652" height="200" rx="10" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
<line x1="68" y1="231" x2="696" y2="231" stroke="#EEEEEE" stroke-width="0.8"/>
<rect x="644" y="198.0" width="52" height="18" rx="9" fill="#E8F0FE"/>
<text x="670.0" y="210.7" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#1A73E8" font-weight="500" text-anchor="middle" >elegido</text>
<text x="70" y="203" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="500" text-anchor="start" >Acreditar</text>
<text x="70" y="219" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5F6368" font-weight="400" text-anchor="start" >Saldo a favor para sus próximas cuotas (no caduca).</text>
<line x1="68" y1="279" x2="696" y2="279" stroke="#EEEEEE" stroke-width="0.8"/>
<text x="70" y="251" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="500" text-anchor="start" >Devolver en efectivo</text>
<text x="70" y="267" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5F6368" font-weight="400" text-anchor="start" >Sale de la caja. Genera comprobante de devolución.</text>
<line x1="68" y1="327" x2="696" y2="327" stroke="#EEEEEE" stroke-width="0.8"/>
<text x="70" y="299" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="500" text-anchor="start" >Condonar</text>
<text x="70" y="315" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5F6368" font-weight="400" text-anchor="start" >El cliente cede el saldo. Queda en caja, registrado.</text>
<rect x="68" y="337" width="628" height="32" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
<rect x="78" y="332" width="93" height="10" rx="2" fill="#FFFFFF"/>
<text x="82" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" fill="#5F6368" font-weight="400" text-anchor="start" >Motivo (opcional)</text>
<rect x="16" y="392" width="688" height="59" rx="8" fill="#E8F0FE"/>
<text x="28" y="411" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#174EA6" font-weight="400" text-anchor="start" >Nota: Si elegís devolver, la app avisa: «Vas a entregar C$ 300 en efectivo — sale de la caja de</text>
<text x="28" y="426" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#174EA6" font-weight="400" text-anchor="start" >hoy» (queda en el arqueo). La decisión se registra en el historial y el mismo excedente no se</text>
<text x="28" y="441" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#174EA6" font-weight="400" text-anchor="start" >ofrece dos veces.</text>
</svg>
