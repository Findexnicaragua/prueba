<text x="28" y="369" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#174EA6" font-weight="400" text-anchor="start" >Nota: El vuelto jamás se da en dólares. El recibo y los reportes registran lo entregado en US$ y</text>
