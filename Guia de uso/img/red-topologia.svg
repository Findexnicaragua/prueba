<text x="56" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="600" text-anchor="start" >Administración → Red: «Topología de red (Nodo → Hub → Puerto)» — árbol expandible con</text>
