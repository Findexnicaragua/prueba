<text x="28" y="699" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#1A73E8" font-weight="600" text-anchor="middle" >3</text>
<text x="56" y="699" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="600" text-anchor="start" >El puerto se asigna al cliente desde SU ficha (sección «Conexión de red»). ¿Para qué?</text>
<text x="56" y="714" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="400" text-anchor="start" >Incidentes deriva los afectados, y el técnico/cobrador ve dónde está conectado</text>
<rect x="16" y="728" width="688" height="44" rx="8" fill="#E8F0FE"/>
<text x="28" y="747" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#174EA6" font-weight="400" text-anchor="start" >Nota: Borrar está bloqueado si el nivel está en uso: «No se puede eliminar: está en uso (N).»</text>
<text x="28" y="762" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#174EA6" font-weight="400" text-anchor="start" >(nodo con hubs, hub con puertos, puerto con clientes).</text>
