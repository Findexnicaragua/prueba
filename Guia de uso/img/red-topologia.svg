<text x="16" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5F6368" font-weight="400" text-anchor="start" >Quién puede: armar: admin / admin de cobranza · el cobrador la ve en la ficha del cliente</text>
