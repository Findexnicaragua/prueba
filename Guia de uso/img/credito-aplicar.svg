<rect x="16" y="428" width="688" height="44" rx="8" fill="#E8F0FE"/>
<text x="28" y="447" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#174EA6" font-weight="400" text-anchor="start" >Nota: «El crédito a favor no es un cobro: no entra a la caja ni al recaudado» (la plata entró el</text>
<text x="28" y="462" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#174EA6" font-weight="400" text-anchor="start" >día que pagó de más). Por eso en la cuota aparece con candado y no se borra.</text>
