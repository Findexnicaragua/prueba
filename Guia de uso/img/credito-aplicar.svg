<text x="56" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="600" text-anchor="start" >La cuota baja su saldo; el movimiento queda en la sección «Saldo a favor» del contrato</text>
