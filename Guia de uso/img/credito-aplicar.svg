<text x="144.0" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5F6368" font-weight="400" text-anchor="start" >Se aplican C$ 300 a la cuota de Agosto 2026 (queda en C$ 150). No entra</text>
<text x="144.0" y="191" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5F6368" font-weight="400" text-anchor="start" >plata: es cobertura con el saldo a favor del cliente.</text>
