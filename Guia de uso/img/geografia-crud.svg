<text x="56" y="473" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="600" text-anchor="start" >El menú de cada fila: Editar · Historial · Eliminar. Borrar solo se puede si NO está en uso</text>
