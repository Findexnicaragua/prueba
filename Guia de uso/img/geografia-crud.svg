<text x="28" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#174EA6" font-weight="400" text-anchor="start" >Nota: «Crece con uso — sólo agregá lo que necesités.» Las comunidades aparecen al crear clientes</text>
