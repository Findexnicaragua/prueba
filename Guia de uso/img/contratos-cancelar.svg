<svg xmlns="http://www.w3.org/2000/svg" width="720" height="453" viewBox="0 0 720 453" role="img">
<rect width="720" height="453" fill="#F8F9FA" rx="10" stroke="#DADCE0"/>
<text x="16" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1F1F1F" font-weight="600" text-anchor="start" >Cancelar un contrato (definitivo)</text>
<text x="16" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5F6368" font-weight="400" text-anchor="start" >Quién puede: admin / admin de cobranza</text>
<circle cx="28" cy="70" r="11" fill="#E8F0FE"/>
<text x="28" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#1A73E8" font-weight="600" text-anchor="middle" >1</text>
<text x="56" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="600" text-anchor="start" >Badge de estado del contrato → «Cancelado» (o desde el flujo de suspensión)</text>
<rect x="56" y="82" width="652" height="199" rx="10" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
<rect x="122.0" y="93" width="520" height="177" rx="16" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
<text x="144.0" y="119" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#1F1F1F" font-weight="600" text-anchor="start" >¿Cancelar este contrato?</text>
<text x="144.0" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5F6368" font-weight="400" text-anchor="start" >Es PERMANENTE: el servicio termina y el contrato NO se puede reactivar. La</text>
<text x="144.0" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5F6368" font-weight="400" text-anchor="start" >deuda real (meses cumplidos + lo consumido del mes en curso) queda COBRABLE;</text>
<text x="144.0" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5F6368" font-weight="400" text-anchor="start" >los meses futuros se anulan. Se imprime un documento con la deuda.</text>
<rect x="144.0" y="180" width="476" height="32" rx="8" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
<text x="154.0" y="199.5" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5F6368" font-weight="400" text-anchor="start" font-style="italic">Motivo de la cancelación (obligatorio) — Ej. Mudanza, insatisfacción del servicio</text>
<rect x="493.0" y="226" width="129" height="28" rx="14" fill="#C5221F"/>
<text x="557.5" y="244.5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#FFFFFF" font-weight="500" text-anchor="middle" >Cancelar contrato</text>
<text x="455.5" y="244.5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#1A73E8" font-weight="500" text-anchor="middle" >Volver</text>
<circle cx="28" cy="307" r="11" fill="#E8F0FE"/>
<text x="28" y="311" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#1A73E8" font-weight="600" text-anchor="middle" >2</text>
<text x="56" y="311" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="600" text-anchor="start" >El contrato queda con su tarjeta de cancelación (la deuda sigue cobrable «fuera de ruta»)</text>
<rect x="56" y="319" width="652" height="58" rx="10" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
<line x1="68" y1="372" x2="696" y2="372" stroke="#EEEEEE" stroke-width="0.8"/>
<rect x="549" y="334.0" width="147" height="28" rx="14" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
<text x="622.5" y="352.5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#1A73E8" font-weight="500" text-anchor="middle" >Revertir cancelación</text>
<text x="70" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="500" text-anchor="start" >Contrato cancelado · 20/07/2026</text>
<text x="70" y="360" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5F6368" font-weight="400" text-anchor="start" >Motivo: Mudanza · Deuda al cancelar (cobrable): C$ 600</text>
<rect x="16" y="391" width="688" height="44" rx="8" fill="#E8F0FE"/>
<text x="28" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#174EA6" font-weight="400" text-anchor="start" >Nota: «Revertir cancelación» existe mientras no hayas cobrado nada de esa deuda (por si fue un</text>
<text x="28" y="425" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#174EA6" font-weight="400" text-anchor="start" >error). Si el cliente vuelve, se le crea un contrato NUEVO.</text>
</svg>
