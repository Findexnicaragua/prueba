<svg xmlns="http://www.w3.org/2000/svg" width="720" height="534" viewBox="0 0 720 534" role="img">
<rect width="720" height="534" fill="#F8F9FA" rx="10" stroke="#DADCE0"/>
<text x="16" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#1F1F1F" font-weight="600" text-anchor="start" >El Centro de cobranza: qué atiendo hoy</text>
<text x="16" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5F6368" font-weight="400" text-anchor="start" >Quién puede: admin / admin de cobranza</text>
<circle cx="28" cy="70" r="11" fill="#E8F0FE"/>
<text x="28" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#1A73E8" font-weight="600" text-anchor="middle" >1</text>
<text x="56" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="600" text-anchor="start" >Las 4 métricas del día</text>
<rect x="56" y="82" width="652" height="154" rx="10" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
<line x1="68" y1="123" x2="696" y2="123" stroke="#EEEEEE" stroke-width="0.8"/>
<rect x="628" y="96.0" width="68" height="18" rx="9" fill="#E8F0FE"/>
<text x="662.0" y="108.7" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#1A73E8" font-weight="500" text-anchor="middle" >8 clientes</text>
<text x="618" y="109.2" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1F1F1F" font-weight="600" text-anchor="end" >C$ 12,450</text>
<text x="70" y="109.2" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="400" text-anchor="start" >Vencen hoy</text>
<line x1="68" y1="159" x2="696" y2="159" stroke="#EEEEEE" stroke-width="0.8"/>
<rect x="623" y="132.0" width="73" height="18" rx="9" fill="#FCE8E6"/>
<text x="659.5" y="144.7" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#C5221F" font-weight="500" text-anchor="middle" >23 clientes</text>
<text x="613" y="145.2" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1F1F1F" font-weight="600" text-anchor="end" >C$ 38,200</text>
<text x="70" y="145.2" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="400" text-anchor="start" >En mora</text>
<line x1="68" y1="195" x2="696" y2="195" stroke="#EEEEEE" stroke-width="0.8"/>
<rect x="623" y="168.0" width="73" height="18" rx="9" fill="#FEF7E0"/>
<text x="659.5" y="180.7" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#B06000" font-weight="500" text-anchor="middle" >ya cortados</text>
<text x="613" y="181.2" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1F1F1F" font-weight="600" text-anchor="end" >4</text>
<text x="70" y="181.2" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="400" text-anchor="start" >A suspender</text>
<line x1="68" y1="231" x2="696" y2="231" stroke="#EEEEEE" stroke-width="0.8"/>
<rect x="628" y="204.0" width="68" height="18" rx="9" fill="#E6F4EA"/>
<text x="662.0" y="216.7" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#188038" font-weight="500" text-anchor="middle" >3 clientes</text>
<text x="618" y="217.2" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1F1F1F" font-weight="600" text-anchor="end" >C$ 1,850</text>
<text x="70" y="217.2" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="400" text-anchor="start" >A favor</text>
<circle cx="28" cy="262" r="11" fill="#E8F0FE"/>
<text x="28" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#1A73E8" font-weight="600" text-anchor="middle" >2</text>
<text x="56" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="600" text-anchor="start" >Abajo, tres secciones de colas: Cobrar · Servicio · Créditos — cada card te lleva a donde se</text>
<text x="56" y="281" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="400" text-anchor="start" >actúa</text>
<rect x="56" y="289" width="652" height="154" rx="10" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/>
<line x1="68" y1="342" x2="696" y2="342" stroke="#EEEEEE" stroke-width="0.8"/>
<text x="643.5" y="322.5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#1A73E8" font-weight="500" text-anchor="middle" >Ver en Avisos</text>
<text x="70" y="314" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="500" text-anchor="start" >En mora — avisar</text>
<text x="70" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5F6368" font-weight="400" text-anchor="start" >Clientes vencidos pasada la gracia.</text>
<line x1="68" y1="390" x2="696" y2="390" stroke="#EEEEEE" stroke-width="0.8"/>
<text x="646.5" y="370.5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#1A73E8" font-weight="500" text-anchor="middle" >Ver contrato</text>
<text x="70" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="500" text-anchor="start" >Ya cortados — falta suspender el contrato</text>
<text x="70" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5F6368" font-weight="400" text-anchor="start" >El técnico cortó pero el contrato sigue facturándose.</text>
<line x1="68" y1="438" x2="696" y2="438" stroke="#EEEEEE" stroke-width="0.8"/>
<text x="649.5" y="418.5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#1A73E8" font-weight="500" text-anchor="middle" >Ver cliente</text>
<text x="70" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="500" text-anchor="start" >Créditos a favor sin aplicar</text>
<text x="70" y="426" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5F6368" font-weight="400" text-anchor="start" >Pagaron de más — aplicá al saldo o devolvé.</text>
<rect x="16" y="457" width="688" height="59" rx="8" fill="#E8F0FE"/>
<text x="28" y="476" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#174EA6" font-weight="400" text-anchor="start" >Nota: El Centro no toca dinero por sí solo: solo te dice QUÉ atender y te lleva ahí. «Ya</text>
<text x="28" y="491" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#174EA6" font-weight="400" text-anchor="start" >cortados» se alimenta de las órdenes de corte de tickets — sin ese módulo la cola queda vacía y</text>
<text x="28" y="506" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#174EA6" font-weight="400" text-anchor="start" >la suspensión se hace manual desde el contrato.</text>
</svg>
