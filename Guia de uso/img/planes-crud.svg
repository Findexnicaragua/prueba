<text x="28" y="556" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#174EA6" font-weight="400" text-anchor="start" >Nota: Sin al menos un plan activo no se pueden crear contratos. Para actualizar el precio a un</text>
