<text x="56" y="454" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#1F1F1F" font-weight="600" text-anchor="start" >Desactivar («No aparecerá al crear nuevos contratos»): los vigentes siguen igual. Subir el</text>
